name: Virenscan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: {{ false }}
    name: Projektdateien scannen
    runs-on: ubuntu-latest
    steps:
      - name: Projektdateien laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Virenscan ausführen
        id: antivirus
        uses: hugoalh/scan-virus-ghaction:scvetkovic18/M324_SARA_CVETKOVIC.git# v0.20.0

      - name: Ergebnis anzeigen
        if: always()
        env:
          FINISH: ${{ steps.antivirus.outputs.finish }}
          FOUND: ${{ steps.antivirus.outputs.found }}
        run: |
          echo "Scan abgeschlossen: $FINISH"
          echo "Fund gemeldet: $FOUND"
